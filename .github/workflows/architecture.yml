name: Architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pin verified upstream v7 revisions for reproducible checks.
      # 固定已核对的上游 v7 版本，保证协作检查可复现。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      # This checks source boundaries, not native Windows functionality.
      # 此检查验证源码边界，不代替 Windows 原生功能回归。
      # CI Node runs this dependency-free guard; the Rust core does not require Node or the old gateway SDK.
      # CI Node 仅运行无第三方依赖的开发守卫；Rust 核心不依赖 Node，此处不安装旧网关 SDK。
      # The private packaged Node runtime is reserved for MCP extensions and verified sandbox skills.
      # 随包私有 Node 仅供 MCP 扩展和已核验的沙箱技能使用。
      - run: node tools/development/check-architecture.mjs

  packaging-guards:
    name: Windows packaging guards
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # These isolated offline checks need neither SDK installation nor private runtime assets.
      # 这些隔离离线检查不需要安装 SDK 或准备私有运行资产。
      # Native build, deployment and GUI acceptance remain separate verification requirements.
      # 原生构建、部署和界面验收仍需单独执行，不能用本任务结果代替。
      - name: Reject incomplete MCP caches
        shell: powershell
        run: ./tests/native-runtime-smoke/check-mcp-cache.ps1
      - name: Check deployment path boundaries
        shell: powershell
        run: ./tests/native-runtime-smoke/check-deployment-paths.ps1
