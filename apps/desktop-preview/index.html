<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KYNXA Desktop Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="window" aria-label="KYNXA Linux UI 预览">
      <header class="titlebar">
        <strong>KYNXA</strong>
        <button class="icon-button title-more" title="更多功能" aria-label="更多功能">•••</button>
        <div class="window-controls" aria-hidden="true"><span>―</span><span>□</span><span>×</span></div>
      </header>

      <div class="shell">
        <aside class="sidebar">
          <div class="mode-switch" role="tablist" aria-label="主模式">
            <span class="mode-pill"></span>
            <button class="mode active" data-mode="work" role="tab" aria-selected="true">
              <span class="mode-glyph">▣</span>工作
            </button>
            <button class="mode" data-mode="chat" role="tab" aria-selected="false">
              <span class="mode-glyph">◯</span>聊天
            </button>
          </div>

          <nav class="global-nav" aria-label="全局导航">
            <button><img src="/desktop-assets/Icons/knowledge.svg" alt="" />知识库</button>
            <button><img src="/desktop-assets/Icons/connect.svg" alt="" />连接</button>
            <button><img src="/desktop-assets/Icons/scheduled-task.svg" alt="" />定时任务</button>
            <button><img src="/desktop-assets/Icons/skills.svg" alt="" />技能</button>
            <button id="manageModels"><img src="/desktop-assets/Icons/model-management.svg" alt="" />模型管理</button>
          </nav>

          <section class="recents">
            <div class="section-title">
              <button id="treeToggle" aria-expanded="true"><span class="chevron">⌄</span><span id="sectionLabel">项目</span></button>
              <button class="section-action" id="newItem" title="添加项目" aria-label="添加项目">
                <img src="/desktop-assets/Icons/folder-add.svg" alt="" />
              </button>
            </div>
            <div id="recentList" class="recent-list"></div>
          </section>

          <footer class="sidebar-footer">
            <button class="icon-button" title="设置"><img src="/desktop-assets/Icons/settings.svg" alt="" /></button>
            <span class="device" title="设备在线">
              <img src="/desktop-assets/Icons/device-status.svg" alt="" /><i></i>
            </span>
          </footer>
        </aside>

        <section class="main-region">
          <div class="ambient" aria-hidden="true"><i></i><i></i></div>
          <div class="empty-state" id="emptyState">
            <div class="logo-wrap"><img src="/desktop-assets/Brand/kynxa-logo.png" alt="KYNXA" /></div>
            <div class="composer-block">
              <div class="composer">
                <textarea id="prompt" rows="2" placeholder="向 KYNXA 提问任何问题..." aria-label="消息输入"></textarea>
                <button class="expand" id="expandComposer" title="展开输入区" aria-label="展开输入区">⌗</button>
                <div class="composer-actions">
                  <div class="left-actions">
                    <button class="round-action" title="添加"><img src="/desktop-assets/Icons/add.svg" alt="" /></button>
                    <button class="text-action" id="permissionButton"><img src="/desktop-assets/Icons/permission-ask.svg" alt="" /><span>请求批准</span></button>
                  </div>
                  <div class="right-actions">
                    <button class="text-action model-button" id="modelButton"><span>模型选择</span><b>⌄</b></button>
                    <button class="send" id="sendButton" title="发送" aria-label="发送"><img src="/desktop-assets/Icons/send-arrow.svg" alt="" /></button>
                  </div>
                </div>
              </div>
              <button class="workspace-chip" id="workspaceButton"><img src="/desktop-assets/Icons/work-folder.svg" alt="" /><span>选择项目</span><b>⌄</b></button>
            </div>
          </div>

          <section class="conversation hidden" id="conversation" aria-live="polite">
            <div class="conversation-title" id="conversationTitle">新工作</div>
            <div class="messages" id="messages"></div>
          </section>

          <div class="popover hidden" id="popover" role="menu"></div>
          <div class="toast hidden" id="toast" role="status"></div>
        </section>
      </div>
    </main>
    <dialog id="modelDialog" class="model-dialog" aria-label="模型管理">
      <form id="modelForm" class="model-form">
        <div class="model-heading"><div><h2>模型管理</h2><p>通过 DeepSeek Harness 连接 OpenAI 兼容 API</p></div><button type="button" id="closeModels" aria-label="关闭">×</button></div>
        <div class="model-layout"><aside><h3>模型连接</h3><div id="providerList"></div><button type="button" id="newProvider">＋ 新建连接</button></aside>
          <div class="model-fields"><div class="presets"><button type="button" id="ollamaPreset">Ollama 本机预设</button><button type="button" id="customPreset">自定义 API</button></div>
            <label>连接名称<input name="displayName" required placeholder="例如 Ollama / DeepSeek API" /></label>
            <label>Provider ID<input name="providerId" required pattern="[a-z][a-z0-9-]{1,39}" placeholder="例如 ollama" /></label>
            <label>Base URL<input name="baseUrl" type="url" required placeholder="https://api.example.com/v1" /></label>
            <label>API Key <small>留空可保留已保存的 Key；本机服务可留空</small><input name="apiKey" type="password" autocomplete="off" /></label>
            <label>Model ID <small>每行一个；无法探测时可手动填写</small><textarea name="models" rows="4" placeholder="例如 deepseek-chat"></textarea></label>
            <div class="model-actions"><button type="button" id="probeModels">测试并获取模型</button><button type="submit">保存连接</button></div>
            <p id="modelStatus" role="status">先填写连接，再测试或保存。</p></div></div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
