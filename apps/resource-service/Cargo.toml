[package]
name = "kynxa-resource-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", default-features = false, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
