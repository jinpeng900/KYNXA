[package]
name = "kynxa-agent-core"
version = "1.5.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "kynxa_agent_core_native"
crate-type = ["rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value", "float_roundtrip", "preserve_order"] }
sha2 = "=0.10.9"
regex = "=1.12.2"
unicode-normalization = "=0.1.24"
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint", "functions", "hooks", "load_extension"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std", "clock"] }
url = "=2.5.8"
ignore = "=0.4.24"
base64 = "=0.22.1"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util", "fs"] }
axum = { version = "=0.8.6", features = ["json", "http1", "tokio"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "=0.3.31"
tokio-stream = { version = "=0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "=1.18.1", features = ["v4"] }
serde_yaml = "=0.9.34"
scraper = "=0.24.0"
usearch = { version = "=2.26.4", default-features = false }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "directml", "ndarray"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false }
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
ndarray = "=0.16.1"
encoding_rs = "=0.8.35"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
quick-xml = "=0.38.3"
lopdf = { version = "=0.38.0", default-features = false }
calamine = { version = "=0.31.0", features = ["chrono"] }
cfb = "=0.12.1"
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
rtf-grimoire = "=0.2.1"
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
bzip2 = "=0.6.1"
tree-sitter = "=0.25.10"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-javascript = "=0.23.1"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.0"
tree-sitter-python = "=0.23.6"
tree-sitter-java = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.23.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
