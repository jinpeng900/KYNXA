<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><title>KYNXA 手机工作台</title><link rel="stylesheet" href="/mobile.css"><script type="module" src="/mobile.js"></script></head>
<body><main><header><div class="brand">K<span>Y</span>NXA <small>REMOTE</small></div><div id="connection" class="connection"><i></i><span>等待连接</span></div></header>
<section id="pair" class="card pair"><span class="eyebrow">让进度随你同行</span><h1>连接电脑工作台</h1><p>扫描电脑上的邀请码，在电脑确认后即可查看会话与任务，并继续发送消息。</p><form id="pair-form"><label>手机名称<input id="device-name" maxlength="80" autocomplete="off" value="我的手机" required></label><label>一次性邀请码<input id="invite-code" maxlength="64" autocomplete="off" placeholder="扫描二维码自动填写" required></label><button id="pair-submit" type="submit">请求配对 <span>↗</span></button></form><p id="pair-status" role="status"></p><small>授权会话与操作范围由电脑确认。离开局域网需要配置可达地址或中继。</small></section>
<div id="dashboard" hidden><section class="card heading"><div><span class="eyebrow">你的工作，正在继续</span><h1 id="chat-title">会话工作台</h1></div><select id="conversation" aria-label="已授权会话"></select><div class="meta"><span id="device-title"></span><button id="disconnect" class="quiet" type="button">断开授权</button></div></section>
<section class="card"><div class="section-heading"><h2>任务动态</h2><span id="task-count" class="pill">0</span></div><div id="tasks" class="tasks"></div><p id="empty-tasks" class="muted">此会话暂无任务</p></section>
<section class="card"><div class="section-heading"><h2>会话</h2><span id="stream-status" class="muted">状态同步</span></div><div id="messages" class="messages" aria-live="polite"></div><div id="live-message" class="live-message" hidden></div><form id="send-form" class="composer"><textarea id="message" maxlength="16000" rows="3" placeholder="继续交代任务，或为正在运行的任务提供引导…" required></textarea><div class="composer-bottom"><select id="send-mode" aria-label="消息模式"><option value="message">发送新消息</option><option value="steer">引导现有任务</option></select><select id="steer-task" aria-label="选择引导任务" hidden></select><button id="send-submit" type="submit">发送 ↑</button></div></form><p id="send-status" role="status"></p></section>
<section class="card"><div class="section-heading"><h2>可下载成果</h2><span class="muted">由电脑明确授权</span></div><div id="downloads"></div><p id="empty-downloads" class="muted">在电脑打开成果并授权后，会显示在这里。</p></section><p id="network-notice" class="network-notice"></p></div><footer>KYNXA · 电脑负责执行，手机保持连接</footer></main></body></html>
